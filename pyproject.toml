[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "citation-drift-lab"
version = "0.1.0"
description = "Source-version-aware local Markdown RAG and citation drift auditing"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Ama Senevirathne"}]
dependencies = [
  "pydantic>=2.7,<3",
  "langgraph>=1.0,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
citation-drift-lab = "citation_drift_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citation_drift_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
